name: Staging Deployment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deploy_to_eks:
        description: "Deploy to EKS after Docker push"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  classify:
    name: Classify Tag
    runs-on: ubuntu-latest
    outputs:
      tag_kind: ${{ steps.check.outputs.tag_kind }}
    steps:
      - name: Classify tag (case-insensitive)
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual dispatch — not a tag push. Treating as a staging-only run."
            echo "tag_kind=rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          LOWER=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')

          if [[ "$LOWER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "Tag '$TAG' matches RC pattern (vX.Y.Z-RCn). Staging only."
            echo "tag_kind=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$LOWER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' matches release pattern (vX.Y.Z, no suffix). Staging + promote to production registry."
            echo "tag_kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' does not match RC or release pattern. Pipeline will not run."
            echo "tag_kind=invalid" >> "$GITHUB_OUTPUT"
          fi

  # trigger-integration-tests:
  #   name: Staging Unit Tests
  #   needs: [classify]
  #   if: ${{ needs.classify.outputs.tag_kind != 'invalid' }}
  #   uses: ./.github/workflows/unit-test.yml
  #   secrets: {}

  container_pipeline:
    name: Staging Container Pipeline
    needs: [classify]
    if: ${{ needs.classify.outputs.tag_kind != 'invalid' }}
    uses: ./.github/workflows/container-pipeline.yml
    with:
      registry: docker.io
      image_repository: ${{ vars.DOCKERHUB_STAGING_IMAGE_REPOSITORY }}
      #django_env: STAGING
      docker_context: .
      dockerfile: Dockerfile
      fail_on_gitleaks: true
      max_image_layers: 35
      max_image_size_mb: 3500
      push_image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    secrets:
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}

